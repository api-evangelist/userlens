name: Userlens
description: Userlens is an AI-native customer success platform for B2B SaaS that
  deploys LLM-powered agents to monitor every customer account, predict churn from
  actual product usage, and surface expansion opportunities. It ingests product
  analytics, CRM data, and business context for AI health scores, account-level
  analytics, and proactive alerts, and exposes a Write-Code-authenticated Events
  API (identify, group, track, and batched SDK event forwarding) plus JavaScript
  SDKs for instrumentation. Founded in 2025 (Y Combinator Spring 2026 batch), based
  in San Francisco and Helsinki.
